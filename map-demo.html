<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Демо: бесплатная 3D-карта (MapLibre + OpenFreeMap)</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,'Segoe UI',sans-serif;background:#1c2436;}
  .bar{
    background:#1c2436;color:#fff;padding:14px 18px;display:flex;
    justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    border-bottom:3px solid #e0b45c;
  }
  .bar h1{font-size:16px;margin:0;}
  .bar p{margin:2px 0 0;font-size:12px;color:#c7cee0;}
  .bar .badge{background:#e0b45c;color:#1c2436;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
  #map{width:100%;height:calc(100vh - 66px);background:#2a3550;}
  .hint{
    position:absolute;bottom:16px;left:16px;background:rgba(28,36,54,.85);color:#fff;
    padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:5;
  }
  /* Фирменный маркер АВИОР — бейдж с названием + иконка инструментов
     под текстом (шестерёнка + отвёртка, по вкусу заказчика). */
  .avior-pin{
    background:#1c2436;
    border:2px solid #e0b45c;
    border-radius:8px 8px 8px 2px;
    padding:7px 13px 8px;
    box-shadow:0 3px 10px rgba(0,0,0,.4);
    text-align:center;
    cursor:pointer;
  }
  .avior-pin .name{
    color:#e0b45c;font-weight:800;font-size:13px;letter-spacing:.03em;white-space:nowrap;
  }
  .avior-pin .tools{font-size:14px;margin-top:2px;line-height:1;}

  /* Всплывающая подсказка — фото витрины, название, адрес, телефон */
  .maplibregl-popup-content{padding:0 !important;border-radius:10px !important;overflow:hidden;}
  .avior-popup img{width:100%;height:120px;object-fit:cover;display:block;}
  .avior-popup .info{padding:10px 14px 12px;font-family:-apple-system,sans-serif;}
  .avior-popup .info b{font-size:15px;color:#1c2436;display:block;margin-bottom:3px;}
  .avior-popup .info .addr{font-size:12.5px;color:#555;display:block;margin-bottom:5px;}
  .avior-popup .info a{font-size:13px;color:#1c2436;text-decoration:none;font-weight:600;}
</style>
</head>
<body>

<div class="bar">
  <div>
    <h1>Демо: 3D-карта без платного API</h1>
    <p>MapLibre GL JS + OpenFreeMap · Можайское шоссе, 4к1, Москва</p>
  </div>
  <span class="badge">0 ₽ / без лимита</span>
</div>

<div style="position:relative;">
  <div id="map"></div>
  <div class="hint">🖱 Зажми правую кнопку (или два пальца) и потяни — покрутишь и наклонишь вид</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.3.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
<script>
  const AVIOR_COORDS = [37.443721, 55.723146];

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: AVIOR_COORDS,
    zoom: 17,
    pitch: 60,
    bearing: -20,
    antialias: true
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

  const pinEl = document.createElement('div');
  pinEl.className = 'avior-pin';
  pinEl.innerHTML = '<div class="name">АВИОР</div><div class="tools">⚙️🪛</div>';

  const popupHtml = `
    <div class="avior-popup">
      <img src="avior-storefront.jpg" alt="Сервис АВИОР — вход">
      <div class="info">
        <b>АВИОР</b>
        <span class="addr">Можайское шоссе, 4к1, Москва</span>
        <a href="tel:+79012228111">📞 +7 (901) 222-81-11</a>
      </div>
    </div>
  `;

  new maplibregl.Marker({ element: pinEl, anchor: 'bottom-left' })
    .setLngLat(AVIOR_COORDS)
    .setPopup(new maplibregl.Popup({ offset: 12, maxWidth: '260px' }).setHTML(popupHtml))
    .addTo(map);
</script>

</body>
</html>
